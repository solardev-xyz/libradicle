[package]
name = "uniffi-bindgen"
version = "0.1.0"
description = "Workspace-local UniFFI bindings generator CLI (cargo run -p uniffi-bindgen)"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The standard UniFFI pattern: a tiny workspace-local bin wrapping the bindgen
# CLI, pinned to the exact uniffi version the binding links against (a version
# skew between scaffolding and generator is a build error by design). Generate
# the Swift bindings with:
#   cargo build -p libradicle-uniffi
#   cargo run -p uniffi-bindgen -- generate --library \
#     target/debug/liblibradicle_uniffi.{so,dylib} --language swift --out-dir <dir>

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
