[package]
name = "libradicle"
version = "0.8.0"
description = "Embeddable Radicle facade: profile + in-process node + storage reads, one crate for desktop (napi) and iOS (uniffi) bindings"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "c2b3e57b7cf49433ea6d8a4dd04a8411277215b9" }
## No default features: `systemd` (socket activation reads and removes
## `LISTEN_*` at bind), `backtrace` and `structured-logger` (the binary's
## panic and log output) are the `radicle-node` binary's, not an embedder's.
## `i2p` stays on: without it, an I2P address in a gossip message fails to
## decode, and the peer that relayed it is disconnected. With it, an I2P
## address is decoded, and dialled only if `node.i2p` routes it (by default
## it is dropped).
radicle-node = { git = "https://github.com/solardev-xyz/heartwood", rev = "c2b3e57b7cf49433ea6d8a4dd04a8411277215b9", default-features = false, features = ["i2p", "socket2", "tor"] }
radicle-surf = { git = "https://github.com/solardev-xyz/heartwood", rev = "c2b3e57b7cf49433ea6d8a4dd04a8411277215b9", features = ["serde"] }
getrandom = "0.4"
git2 = { version = "0.21", default-features = false }
radicle-signals = { git = "https://github.com/solardev-xyz/heartwood", rev = "c2b3e57b7cf49433ea6d8a4dd04a8411277215b9" }
log = "0.4"
serde = "1"
serde_json = "1"
thiserror = "2"
zeroize = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }

[features]
## No child processes anywhere: serve fetches in-process (libgit2 + a
## hand-written packfile, no `git upload-pack`) and skip `git gc`. Required
## for iOS, which cannot spawn children — and, unlike the old decline-to-serve
## behaviour, this lets a no-spawn node publish: peers can fetch its refs.
## Leave off for desktop, which serves via `git upload-pack` as before.
no-spawn = ["radicle-node/serve-in-process", "radicle-node/no-gc"]

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"

[profile.release]
lto = "thin"

[workspace]
members = [".", "napi", "uniffi", "uniffi-bindgen"]
