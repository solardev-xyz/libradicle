[package]
name = "libradicle"
version = "0.2.3"
description = "Embeddable Radicle facade: profile + in-process node + storage reads, one crate for desktop (napi) and iOS (uniffi) bindings"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "277dbb8cd1efb921e881b86720b1aced298da97d" }
radicle-node = { git = "https://github.com/solardev-xyz/heartwood", rev = "277dbb8cd1efb921e881b86720b1aced298da97d" }
getrandom = "0.4"
git2 = { version = "0.21", default-features = false }
radicle-signals = { git = "https://github.com/solardev-xyz/heartwood", rev = "277dbb8cd1efb921e881b86720b1aced298da97d" }
log = "0.4"
thiserror = "2"

[features]
## No child processes anywhere: decline serving fetches, skip git gc.
## Required for iOS; leave off for desktop, which serves and publishes.
no-spawn = ["radicle-node/no-serve", "radicle-node/no-gc"]

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"

[profile.release]
lto = "thin"

[workspace]
members = [".", "napi"]
