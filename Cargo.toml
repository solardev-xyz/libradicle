[package]
name = "libradicle"
version = "0.5.0"
description = "Embeddable Radicle facade: profile + in-process node + storage reads, one crate for desktop (napi) and iOS (uniffi) bindings"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "394aa12d00855f09eb07638221993b4514682f6e" }
radicle-node = { git = "https://github.com/solardev-xyz/heartwood", rev = "394aa12d00855f09eb07638221993b4514682f6e" }
radicle-surf = { git = "https://github.com/solardev-xyz/heartwood", rev = "394aa12d00855f09eb07638221993b4514682f6e", features = ["serde"] }
getrandom = "0.4"
git2 = { version = "0.21", default-features = false }
radicle-signals = { git = "https://github.com/solardev-xyz/heartwood", rev = "394aa12d00855f09eb07638221993b4514682f6e" }
log = "0.4"
thiserror = "2"

[features]
## No child processes anywhere: serve fetches in-process (libgit2 + a
## hand-written packfile, no `git upload-pack`) and skip `git gc`. Required
## for iOS, which cannot spawn children — and, unlike the old decline-to-serve
## behaviour, this lets a no-spawn node publish: peers can fetch its refs.
## Leave off for desktop, which serves via `git upload-pack` as before.
no-spawn = ["radicle-node/serve-in-process", "radicle-node/no-gc"]

[dev-dependencies]
anyhow = "1"
env_logger = "0.11"

[profile.release]
lto = "thin"

[workspace]
members = [".", "napi"]
