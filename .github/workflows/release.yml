name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, key: mac-arm64, lib: liblibradicle_napi.dylib }
          # Intel macOS runners (macos-13) are deprecated and queue
          # indefinitely — cross-compile x64 from the arm64 runner instead.
          - {
              os: macos-14,
              key: mac-x64,
              lib: liblibradicle_napi.dylib,
              target: x86_64-apple-darwin,
            }
          - { os: ubuntu-22.04, key: linux-x64, lib: liblibradicle_napi.so }
          - { os: ubuntu-24.04-arm, key: linux-arm64, lib: liblibradicle_napi.so }
          # Windows: the cdylib has no `lib` prefix and a `.dll` suffix.
          # `napi_build::setup()` (napi/build.rs) handles the delay-load link.
          - { os: windows-latest, key: win-x64, lib: libradicle_napi.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build napi addon
        shell: bash
        # `no-spawn` on every platform: Freedom ships self-contained, with no
        # system `git` dependency (serve in-process, skip git gc).
        run: cargo build --release -p libradicle-napi --features no-spawn ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Rename artifact
        shell: bash
        run: cp target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/${{ matrix.lib }} libradicle-${{ matrix.key }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: libradicle-${{ matrix.key }}
          path: libradicle-${{ matrix.key }}.node

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum libradicle-*.node > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libradicle-*.node
            SHA256SUMS
          generate_release_notes: true
