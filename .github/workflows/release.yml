name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, key: mac-arm64, lib: liblibradicle_napi.dylib }
          - { os: macos-13, key: mac-x64, lib: liblibradicle_napi.dylib }
          - { os: ubuntu-22.04, key: linux-x64, lib: liblibradicle_napi.so }
          - { os: ubuntu-24.04-arm, key: linux-arm64, lib: liblibradicle_napi.so }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build napi addon
        run: cargo build --release -p libradicle-napi
      - name: Rename artifact
        run: cp target/release/${{ matrix.lib }} libradicle-${{ matrix.key }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: libradicle-${{ matrix.key }}
          path: libradicle-${{ matrix.key }}.node

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum libradicle-*.node > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libradicle-*.node
            SHA256SUMS
          generate_release_notes: true
