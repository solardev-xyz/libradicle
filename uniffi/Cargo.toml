[package]
name = "libradicle-uniffi"
version = "0.6.1"
description = "UniFFI (Swift/iOS) binding over libradicle — the iOS half of Freedom Browser's Radicle integration"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "libradicle_uniffi"
# `lib`/`rlib` for host unit tests; `staticlib` for the iOS device/simulator
# archives AND the bindgen library scan (uniffi library mode reads the
# metadata straight out of the archive). Deliberately NO `cdylib`: a dylib
# link demands every native symbol resolved within this crate's own graph,
# but aggregator consumers (freedom-mobile-ffi) satisfy some native deps —
# SQLite — only at final app link, from a sibling member's bundled copy.
crate-type = ["lib", "staticlib"]

[dependencies]
libradicle = { path = ".." }
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "c208df3ac7626402db60752f1f38d31465731f01" }
serde_json = "1"
uniffi = "0.32"

[features]
## Make the embedded node spawn-free (serve fetches in-process, skip git gc).
## iOS builds enable this; it is the whole reason the iOS node can publish.
no-spawn = ["libradicle/no-spawn"]
