[package]
name = "libradicle-napi"
version = "0.8.0"
description = "Node.js (napi-rs) binding over libradicle — the Freedom Browser desktop path, replacing radicle-httpd"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# libradicle.node — loaded by Node via a thin JS loader.
crate-type = ["cdylib"]

[features]
## Ship the desktop addon spawn-free: serve fetches in-process and skip
## `git gc`, so Freedom needs no system `git`. Every released build enables
## this (Freedom is a browser, not a dev tool — users don't have git).
no-spawn = ["libradicle/no-spawn"]

[dependencies]
libradicle = { path = ".." }
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "6b2dc16fa657bbcb03c34eaee922d354fb1fe66e" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
